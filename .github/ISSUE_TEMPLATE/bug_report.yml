name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Firmware, Hardware, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Firmware version, hardware revision or commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Serial output
      render: text
